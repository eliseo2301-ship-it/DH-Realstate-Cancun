services:
  # Servidor Web Fullstack (Express API + Frontend React optimizado)
  - type: web
    name: dh-realstate-cancun
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000

  # Opción Alternativa: Despliegue como Static Site en Render
